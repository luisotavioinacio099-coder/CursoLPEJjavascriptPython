<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3º Exercício</title>
    <link rel="stylesheet" type="text/css" href="../../style.css">
</head>

<body>
    <header class="header-main">
        <a href="./index.html">
            <h1>Voltar a Introdução ao Javascript Nativo.</h1>
        </a>
    </header>

    <main class="main-content">
        <div class="form-group">
            <label for="titulo_livro">Digite o Título do Livro:</label>
            <input type="text" id="titulo_livro" placeholder="Digite aqui...">
        </div>
        <div class="form-group">
            <label for="lancamento_livro">Digite o Ano de Lançamento:</label>
            <input type="text" id="lancamento_livro" placeholder="Digite aqui...">
        </div>
        <div class="form-group">
            <label for="edicao_livro">Digite a Edição do Livro:</label>
            <input type="text" id="edicao_livro" placeholder="Digite aqui...">
        </div>        
        <div class="form-group">
            <label for="autor_livro">Digite o Nome do Autor:</label>
            <input type="text" id="autor_livro" placeholder="Digite aqui...">
        </div>        
        
        <button type="submit" class="btn success" id="btn_mostrar" onclick="DadosDoLivro()">Mostrar</button>
    </main>

    <script>

        const btnMostrar = document.getElementById("#btn_mostrar")

        btnMostrar.addEventListener("click", DadosDoLivro)

        function DadosDoLivro(){
            const titulo_livro = document.querySelector("#titulo_livro").value
            const lancamento_livro = document.querySelector("#lancamento_livro").value
            const edicao_livro = document.querySelector("#edicao_livro").value
            const autor_livro = document.querySelector("#autor_livro").value

            alert(
                "Nome do Livro: " + titulo_livro + 
                ".\nLançamento: " + lancamento_livro + 
                ".\nEdição: " + edicao_livro + 
                ".\nAutor: " + autor_livro
            )
        }

    </script>
</body>
</html>
