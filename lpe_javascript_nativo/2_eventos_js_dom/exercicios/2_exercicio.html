<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2º Exercício</title>
    <link rel="stylesheet" type="text/css" href="../../style.css">
</head>

<body>
    <header class="header-main">
        <a href="./index.html">
            <h1>Voltar a Introdução ao Javascript Nativo.</h1>
        </a>
    </header>

    <main class="main-content">
        <div class="form-group">
            <label for="nome_produto">Digite o Nome do Produto:</label>
            <input type="text" id="nome_produto" placeholder="Digite aqui...">
        </div>
        <div class="form-group">
            <label for="custo_produto">Digite o Preço (R$):</label>
            <input type="text" id="custo_produto" placeholder="Digite aqui...">
        </div>
        <div class="form-group">
            <label for="estoque_produto">Qtd. em Estoque:</label>
            <input type="text" id="estoque_produto" placeholder="Digite aqui...">
        </div>        
        
        <button type="submit" class="btn success" id="btn_mostrar" onclick="MostrarDadosProuto()">Mostrar</button>
    </main>

    <script>

        const btnMostrar = document.getElementById("#btn_mostrar")

        btnMostrar.addEventListener("click", MostrarDadosProuto)

        function MostrarDadosProuto(){
            const nomeProduto = document.querySelector("#nome_produto").value
            const custoProduto = document.querySelector("#custo_produto").value
            const estoqueProduto = document.querySelector("#estoque_produto").value

            alert("Nome do Produto: " + nomeProduto + ".\nCusto: R$ " + custoProduto + ".\nQtd. em Estoque: " + estoqueProduto)
        }

    </script>
</body>
</html>
