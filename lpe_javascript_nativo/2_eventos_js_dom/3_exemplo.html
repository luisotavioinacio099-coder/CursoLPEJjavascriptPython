<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar Conteúdo HTML</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <header class="header-main">
        <a href="./index.html">
            <h1>Voltar a Introdução ao Javascript Nativo.</h1>
        </a>
    </header>

    <main class="main-content">
        <h2>3º Exemplo: Alterar Conteúdo HTML.</h2>

        <div class="form-group">
            <label for="nome_completo">Nome Completo:</label>
            <input type="text" id="nome_completo" placeholder="Digite aqui...">
        </div>

        <button type="submit" class="btn success" id="btn_mostrar_boas_vindas">Mostrar Seja Bem Vindo</button>

        <p id="msg"></p>

        <hr>

        <p id="titulo_alterar">Olá! Selecione uma configuração para modificar o estilo desse texto.</p>

        <div class="form-group">
            <label for="example3">Selecione a COR do texto:</label>
            <select id="opcao_cor_texto">
                <option value="">Selecione</option>
                <option value="blue">Azul</option>
                <option value="red">Vermelho</option>
                <option value="orange">Laranja</option>
            </select>
        </div>

        <div class="form-group">
            <label for="example3">Selecione o TAMANHO do texto:</label>
            <select id="opcao_tamanho_texto">
                <option value="">Selecione</option>
                <option value="12">12</option>
                <option value="14">14</option>
                <option value="16">16</option>
            </select>
        </div>   

        <button type="submit" id="btn_formatar_estilo" class="btn success">Formatar</button>

        <hr>

        <button type="submit" id="btn_pessoa_fisica" class="btn success">Mostrar Pessoa Física</button>
        <button type="submit" id="btn_pessoa_juridica" class="btn success">Mostrar Pessoa Jurídica</button>

        <div class="form-group" id="cpf" style="display: none;">
            <label for="cpf">Digite seu CPF:</label>
            <input type="text" id="cpf" placeholder="Digite aqui...">
        </div>

        <div class="form-group" id="cnpj" style="display: none;">
            <label for="cnpj">Digite seu CNPJ:</label>
            <input type="text" id="cnpj" placeholder="Digite aqui...">
        </div>
    </main> 

    <!-- Área de Desenvolvimento em Javascript. -->
    <script>
    
        // 1º Exemplo: Manipulação do DOM e alteração da Página HTML! ======================
        const btn_mostrar = document.getElementById("btn_mostrar_boas_vindas")
        const msg_mostrar = document.getElementById("msg")

        btn_mostrar.addEventListener("click", () => {
            const nome_usuario = document.getElementById("nome_completo").value
            
            msg_mostrar.innerHTML = `Seja bem vindo(a) ${nome_usuario}`
        })

        // 2º Exemplo: Manipulação do DOM e alteração da Página HTML! ======================
        const btn_formatar_estilo = document.getElementById("btn_formatar_estilo")
        const titulo_alterar = document.getElementById("titulo_alterar")

        btn_formatar_estilo.addEventListener("click", () => {
            const cor = document.getElementById("opcao_cor_texto").value
            const tamanho = document.getElementById("opcao_tamanho_texto").value

            titulo_alterar.style.color = cor
            titulo_alterar.style.fontSize = tamanho + "px"
        })

        // 3º Exemplo: Manipulação do DOM e alteração da Página HTML! ======================
        const btn_mostrar_cpf = document.getElementById("btn_pessoa_fisica")
        const btn_mostrar_cnpj = document.getElementById("btn_pessoa_juridica")

        const div_cpf = document.getElementById("cpf")
        const div_cnpj = document.getElementById("cnpj")

        btn_mostrar_cpf.addEventListener("click", () => {
            div_cpf.style.display = "block"
            div_cnpj.style.display = "none"
        })

        btn_mostrar_cnpj.addEventListener("click", () => {
            div_cnpj.style.display = "block"
            div_cpf.style.display = "none"
        })
    
    </script>

</body>
</html>
