<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captura de Informações Digitadas</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <header class="header-main">
        <a href="./index.html">
            <h1>Voltar a Introdução ao Javascript Nativo.</h1>
        </a>
    </header>

    <main class="main-content">
        <h2>1º Exemplo: Captura de Informações Digitadas.</h2>

        <div class="form-group">
            <label for="nome_usuario">Digite seu Nome Completo:</label>
            <input type="text" id="nome_usuario" placeholder="Digite aqui...">
        </div>

        <div class="form-group">
            <label for="email_usuario">Digite seu E-mail:</label>
            <input type="email" id="email_usuario" placeholder="Digite aqui...">
        </div>

        <button type="submit" class="btn success" id="btnMostrar">Mostrar</button>
    </main> 

    <!-- Área de Desenvolvimento em Javascript. -->
    <script>
    
        // Captura e Identificação do elemento na página HTML.
        const btn_mostrar = document.getElementById("btnMostrar")

        // Função restritra, a ação do clique do botão!
        btn_mostrar.addEventListener("click", mostrarDadosDigitados)

        function mostrarDadosDigitados(){
            const nome_completo = document.querySelector("#nome_usuario").value
            const email_usuario = document.querySelector("#email_usuario").value

            alert("Nome Completo: " + nome_completo + "\nE-mail do Usuário: " + email_usuario)
        }
    
    </script>

</body>
</html>
