<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1º Exercício - Cálculos</title>
    <link rel="stylesheet" type="text/css" href="../../style.css">
</head>

<body>
    <header class="header-main">
        <a href="./index.html">
            <h1>Voltar a Introdução ao Javascript Nativo.</h1>
        </a>
    </header>

    <main class="main-content">
        <div class="form-group">
            <label for="valor_1">Digite o 1º Número:</label>
            <input type="text" id="valor_1" placeholder="Digite aqui...">
        </div>
        <div class="form-group">
            <label for="valor_2">Digite o 2º Número:</label>
            <input type="text" id="valor_2" placeholder="Digite aqui...">
        </div>
        <div class="form-group">
            <label for="valor_3">Digite o 3º Número:</label>
            <input type="text" id="valor_3" placeholder="Digite aqui...">
        </div>
        <div class="form-group">
            <label for="valor_4">Digite o 4º Número:</label>
            <input type="text" id="valor_4" placeholder="Digite aqui...">
        </div>       
        <button type="button" class="btn success" id="btn_calcular">Mostrar</button>
    </main>

    <script>

        const btnMostrar = document.getElementById("btn_calcular")

        btnMostrar.addEventListener("click", CalcularValores)

        function CalcularValores(){
            const num_1 = Number(document.querySelector("#valor_1").value)
            const num_2 = Number(document.querySelector("#valor_2").value)
            const num_3 = Number(document.querySelector("#valor_3").value)
            const num_4 = Number(document.querySelector("#valor_4").value)

            // Váriaveis com os Cálculos!
            const soma = num_1 + num_2 + num_3 + num_4
            const multiplicar = soma * 2

            alert("Soma de Todos os Valores: " + soma + "\nDobro da Soma: " + multiplicar)
        }

    </script>
</body>
</html>
