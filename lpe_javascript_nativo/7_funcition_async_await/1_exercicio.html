<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1º Exercício</title>
    <style>
        /* Estilos básicos para melhor visualização */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7fc;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header-main {
            background-color: #2c3e50;
            color: white;
            padding: 1.5rem 0;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header-main h1 {
            margin: 0;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .main-content {
            flex: 1;
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .main-content h2 {
            color: #2c3e50;
            margin-top: 0;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 0.75rem;
        }

        .btn {
            display: inline-block;
            font-weight: 600;
            padding: 0.75rem 2rem;
            margin: 1.5rem 0;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
        }

        .btn.success {
            background-color: #27ae60;
            color: white;
            box-shadow: 0 4px 8px rgba(39, 174, 96, 0.3);
        }

        .btn.success:hover {
            background-color: #2ecc71;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(39, 174, 96, 0.4);
        }

        .btn.success:active {
            transform: translateY(0);
            box-shadow: 0 2px 4px rgba(39, 174, 96, 0.3);
        }

        #msg {
            background-color: #f8f9fa;
            padding: 1.5rem;
            border-radius: 8px;
            border-left: 4px solid #3498db;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            text-align: left;
            line-height: 1.8;
            min-height: 100px;
            color: #2c3e50;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.05);
        }

        #msg:empty::before {
            content: "Aguardando ação...";
            color: #bdc3c7;
            font-style: italic;
            font-family: 'Segoe UI', sans-serif;
        }

        footer {
            text-align: center;
            padding: 1rem;
            color: #7f8c8d;
            font-size: 0.9rem;
            background-color: #ecf0f1;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <header class="header-main">
        <h1>Lógica de programação com Javascript Nativo</h1>
    </header>
    <main class="main-content">
        <h2>Exercício 1: Simulador de Download</h2>
        <button type="submit" id="btn_iniciar" class="btn success">Iniciar Download</button>
        <p id="msg"></p>
    </main>
    <footer>
        <p>Simulação de download assíncrono com JavaScript</p>
    </footer>

    <script>
        const btn_iniciar = document.getElementById("btn_iniciar");
        const msg = document.getElementById("msg");

        async function processarDownload() {
            msg.innerHTML += "Iniciando Download...<br>";

            // Simula o processamento da tarefa com Promise
            return new Promise((resolve) => {
                setTimeout(() => {
                    msg.innerHTML += "Download concluído!<br>";
                    resolve();
                }, 2000);
            });
        }

        async function iniciarDownload() {
            msg.innerHTML += "Enviando solicitação...<br>";
            await processarDownload();
            msg.innerHTML += "Aguardando finalização...<br>";
        }

        function fazerAcao() {
            msg.innerHTML = "";
            // Chamada assíncrona sem await para não bloquear
            iniciarDownload();
            msg.innerHTML += "Realizando outro processo...<br>";
        }

        // Fonte para ação do Botão
        btn_iniciar.addEventListener("click", fazerAcao);
    </script>
</body>
</html>
