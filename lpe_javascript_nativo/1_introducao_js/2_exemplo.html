<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variáves em Javascript Nativo</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header class="header-main">
        <a href="./index.html">
            <h1>Voltar a Introdução ao Javascript Nativo.</h1>
        </a>
    </header>

    <main class="main-content">
        <h2>2º Exemplo: Variáves em Javascript Nativo</h2>

        <div class="module-list">
           <a href="" class="btn success">Clique para Executar</a>
        </div>
    </main> 
    
    <!-- Área de desenvolvimento em Javascript! -->
    <script>

        // VAR - Método antigo de versões anteriores do Javascript para declarar váriaveis!
        var teste_1

        // LET - Método novo da versão atual do Javascript para declarar váriaveis!
        let teste_2

        // Método de congelamento, constancia de valores ou execuções de processos no código!
        // Toda váriavel const é orbigatório que algum valor seja atribuido, mesmo que seja um vazio!
        const teste_3 = null
        const teste_4 = ""

        // string - Caracter de texto!
        // int - Caracter numérico!

        const nome_usuario = "Alisson Rocha"
        const idade_usuario = 33
        let peso = 78

        alert(nome_usuario + " sem almoço, esta com " + peso + " kg.")

        // Substituir um valor já declarado!
        peso = peso + 3

        alert(nome_usuario + " depois do almoço, esta com " + peso + " kg.")

    </script>
</body>
</html>
