<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2º Exercicio - Contagem Progressiva</title>
    <link rel="stylesheet" type="text/css" href="../style.css">
</head>

<body>
    <header class="header main">
        <h1>Logica de programação com Javascript Nativo</h1>
    </header>

    <main class="main-content">
        <h2>Contagem Progressiva.</h2>

        <div class="form-group">
            <label for="numero">Digite um número:</label>
            <input type="text" id="numero" placeholder="Digite um número...">
        </div>

        <p id="msg_contagem"></p>

        <button type="button" id="btn_contar" class="btn success">Iniciar Contagem</button>
    </main>

    <script>
        const btnContar = document.getElementById("btn_contar");
        const msg_contagem = document.getElementById("msg_contagem");

        btnContar.addEventListener("click", () => {
            const numero = document.getElementById("numero").value;

            if(isNaN(numero) || numero === ""){
                msg_contagem.innerHTML = "Digite apenas caracteres NUMÉRICOS!";
                return;
            }

            let resultado_final = "";
            const numConvertido = Number(numero);

            for(let i = 0; i <= numConvertido; i++){
                if(i === numConvertido){
                    resultado_final += `${i}`;
                } else {
                    resultado_final += `${i} → `;
                }
            }

            if(numConvertido < 0){
                msg_contagem.innerHTML = "Digite um número maior ou igual a 0!";
            } else {
                msg_contagem.innerHTML = resultado_final;
            }
        });
    </script>
</body>
</html>
